<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nodo Central</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="py-10">
  <h1 class="text-4xl font-black text-gray-900 text-center tracking-tight">
    Nodo Central
  </h1>
</header>




    <main class="max-w-[85vw] mx-auto px-8 py-4 grid grid-cols-12 gap-6 pb-20">

    <section class="col-span-12 bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
        <h1 class="text-2xl font-bold">Historia Reciente</h1>
        <section class="p-6 bg-white rounded-xl border border-gray-200 shadow-sm mt-6">
    <h2 class="text-lg font-bold text-gray-800 mb-4">Eventos esta semana:</h2>
    <div class="h-64 w-full">
        <canvas id="graficoEventos"></canvas>
    </div>
</section>
    </section>

    <aside class="col-span-12   bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
        <h2 class="font-bold mb-4 text-center" >Estadísticas Importantes</h2>
        <div id="indicadores-rapidos" class="max-w-[95vw] mx-auto px-4 mt-6">
    </div>
    </aside>

<div class="col-span-12 grid-cols-2 flex flex-col gap-6">
    <div class="grid grid-cols-2 gap-4">
        
        <section class="bg-white rounded-xl border border-gray-200 shadow-sm h-96 overflow-y-auto relative">
            <div class="sticky top-0 bg-white p-6 pb-2 z-10">
                <h2 class="font-bold text-xl text-gray-800">Sensores</h2>
            </div>
            
            <div id="lista-sensores" class="grid grid-cols-1 md:grid-cols-2 gap-4 p-6 pt-0">
                </div>
        </section>
             
        <section class="bg-white rounded-xl border border-gray-200 shadow-sm h-96 overflow-y-auto relative">
            <div class="sticky top-0 bg-white p-6 pb-2 z-10">
                <h2 class="font-bold text-xl text-gray-800">Receptores</h2>
            </div>
            
            <div id="lista-receptores" class="p-6 pt-0 space-y-4"> 
                </div>
        </section>

    </div>
</div>

<footer class="col-span-12 bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden mb-10 h-96 flex flex-col">
    
    <div class="sticky top-0 bg-white p-6 border-b border-gray-100 z-10 flex items-center justify-between">
        <h2 class="font-bold text-2xl flex items-center gap-2 text-gray-800">
            Historial de Eventos
        </h2>
    </div>

    <div class="flex-1 overflow-y-auto p-4 custom-scroll">
        <!-- ═══════════════════════════════════════════════════════════
     BOTONES DE EXPORTAR / BORRAR
     Pega este bloque dentro de tu index.html, en la sección del
     historial (por ejemplo justo arriba de <div id="lista-historial">).
     Los IDs (btn-exportar, btn-borrar) son los que usa script.js.
     ═══════════════════════════════════════════════════════════ -->
<div class="flex flex-wrap items-center gap-3 mb-4">
    <button id="btn-exportar"
            class="bg-blue-600 text-white rounded-lg px-4 py-2 font-semibold hover:bg-blue-700 transition">
        Exportar datos
    </button>

    <button id="btn-borrar" disabled
            class="bg-red-600 text-white rounded-lg px-4 py-2 font-semibold hover:bg-red-700 transition disabled:opacity-40 disabled:cursor-not-allowed">
        Borrar Historial
    </button>

    <span class="text-xs text-gray-500">
        Puedes borrar el historial después de exportarlo.
    </span>
</div>
        <div id="lista-historial" class="space-y-3">
            </div>
    </div>

</footer>



</main>





     <script src="script.js"></script>
</body>
</html>
