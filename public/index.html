<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nodo Central</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="py-10">
  <h1 class="text-4xl font-black text-gray-900 text-center tracking-tight">
    Nodo Central
  </h1>
</header>

<!-- <div id="lista-sensores" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
</div> -->

<main class="max-w-[95vw] mx-auto p-4 grid grid-cols-12 gap-6">

    <section class="col-span-12 bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
        <h1 class="text-2xl font-bold">Título o Resumen General</h1>
        <section class="p-6 bg-white rounded-xl border border-gray-200 shadow-sm mt-6">
    <h2 class="text-lg font-bold text-gray-800 mb-4">Actividad de la Última Semana</h2>
    <div class="h-64 w-full">
        <canvas id="graficoEventos"></canvas>
    </div>
</section>
    </section>

    <aside class="col-span-12 lg:col-span-4 bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
        <h2 class="font-bold mb-4">Panel de Control / Filtros</h2>
        <p class="text-sm text-gray-600">Aquí puedes poner configuraciones o estadísticas rápidas.</p>
    </aside>

    <div class="col-span-12 lg:col-span-8 flex flex-col gap-6">
        
        <section class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm h-96 overflow-y-auto">
            <h2 class="font-bold mb-4">Monitor de Sensores</h2>
            <div id="lista-sensores" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                </div>
        </section>

        <section class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
            <h2 class="font-bold mb-4">Receptores</h2>
            <div id="lista-receptores"> </div>
        </section>
        
    </div>

    <footer class="col-span-12 bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
        <p class="text-center text-gray-400 text-sm">Historial de Eventos</p>
        <div id="lista-historial"> </div>
    </footer>

</main>
